name: Playwright Tests

on:
  pull_request:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Only the anonymous tests run here. Anything tagged @auth needs a real
      # login, and --no-deps skips the perform-login setup project that would
      # otherwise sign in through the UI.
      - name: Run Playwright tests
        run: npx playwright test --grep-invert @auth --no-deps

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
